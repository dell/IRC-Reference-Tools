name: "nvlink"
isBuiltIn: true

powerState:
  uri: "/redfish/v1/Systems/System_0"
  path: "$.PowerState"
  monitorType: "redfish-sse"
  powerOnMsgId: "EventLog.1.0.StatusChange"
  powerOffMsgId: "EventLog.1.0.StatusChange"
  powerOnMessageArgs: "1-Powered On"
  powerOffMessageArgs: "1-Powered Off"

systemId:
  uri: "/redfish/v1/Systems/System_0"
  path: "$.SerialNumber"

shutdown:
  graceful:
    uri: "/redfish/v1/Systems/System_0/Actions/ComputerSystem.Reset"
    method: "POST"
    body: '{"ResetType": "GracefulShutdown"}'
  force:
    uri: "/redfish/v1/Systems/System_0/Actions/ComputerSystem.Reset"
    method: "POST"
    body: '{"ResetType": "ForceOff"}'
